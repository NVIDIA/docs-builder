# Half 2 of the fork-safe preview build pair. Triggered after the `build`
# workflow completes. Runs the secret-bearing preview in a trusted, pinned
# docs-builder image instead of the image built from the untrusted PR.

name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

jobs:
  preview:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      id-token: write
      pull-requests: write
    uses: NVIDIA/docs-builder/.github/workflows/_fern_docs_preview_comment.yml@main
    with:
      container-image: ghcr.io/nvidia/docs-builder:0.5.1
    secrets:
      DOCS_FERN_AWS_ROLE_TO_ASSUME: ${{ secrets.DOCS_FERN_AWS_ROLE_TO_ASSUME }}
      DOCS_FERN_SECRET_ID: ${{ secrets.DOCS_FERN_SECRET_ID }}
