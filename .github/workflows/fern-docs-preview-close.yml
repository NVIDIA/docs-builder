# Half 1 of the fork-safe preview cleanup pair. Runs on PR close with no
# secrets, reads the preview URL embedded in the sticky PR comment, and
# uploads it as an artifact. The companion `fern-docs-preview-cleanup.yml`
# picks up the artifact under workflow_run and deletes the preview.

name: "Preview Fern Docs: Close"

on:
  pull_request:
    types: [closed]

jobs:
  close:
    uses: ./.github/workflows/_fern_docs_preview_close_collect.yml
