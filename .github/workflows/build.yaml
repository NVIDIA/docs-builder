# Builds and pushes the docs-builder image, then collects fern sources for
# the preview comment workflow to use against that freshly pushed image.
#
# Triggers:
#   - pull_request:  build + push :sha-<short>, then hand off the tag to the
#                    fern preview build collector so the comment workflow can
#                    pull this exact image.
#   - push tag v*:   build + push :<semver>, no fern preview.
#
# The companion fork-safe Fern workflows live in:
#   - fern-docs-preview-comment.yml   (workflow_run: builds + comments)
#   - fern-docs-preview-close.yml     (pull_request closed: collect URL)
#   - fern-docs-preview-cleanup.yml   (workflow_run: delete preview)

name: build

on:
  pull_request:
    branches:
      - main
      - 'release-*'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image-ref.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # On pull_request, type=sha derives from the PR merge commit SHA (github.sha), not the PR head.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
          flavor: |
            latest=false
      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        id: build_for_test
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Test image
        run: |
          docker run --rm -v $(pwd):/work -w /work \
            "${{ steps.build_for_test.outputs.imageid }}" \
            bash -c "make install-dev && make test"
      - name: Push to Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Export primary image reference
        id: image-ref
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          PRIMARY=$(echo "$TAGS" | head -n 1)
          echo "image-ref=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "Primary image reference: ${PRIMARY}"

  fern-collect:
    # Only run the Fern preview collector on PRs. Tag builds do not need a
    # preview.
    if: ${{ github.event_name == 'pull_request' }}
    needs: image
    uses: mikemckiernan/FW-CI-templates/.github/workflows/_fern_docs_preview_build.yml@mmck-docs-fern
    with:
      fern-directory: docs/fern
